nav{position:fixed;inset:0 0 auto;z-index:20;transition:.3s;padding:.9rem 0}

.logo{font:700 1rem var(--d);text-decoration:none}
.links{display:none;gap:1.4rem;font-size:.92rem}
.links a{text-decoration:none;opacity:.8}.links a:hover{opacity:1}
.lang{display:flex;border:1.5px solid var(--ink);border-radius:99px;overflow:hidden}
.lang button{font:500 .78rem var(--b);border:0;background:none;padding:.3rem .7rem;cursor:pointer;color:var(--ink)}

.ph span{font:500 .78rem var(--b);letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.7);padding:.4rem .8rem;border-radius:99px;text-align:center;margin:.5rem}
.c2{background-image:linear-gradient(120deg,#8FA6BD,#C8D4E0,#6F89A6,#B5C5D6)}
.c3{background-image:linear-gradient(120deg,#9AB8E0,#D6E4F4,#7A9FD0,#C0D4EC)}

.hero .w{display:grid;gap:2rem}
.tag{display:inline-block;border:1.5px solid var(--ink);border-radius:99px;padding:.25rem .9rem;font-size:.82rem;margin-bottom:1.2rem}
.tag::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--coral);margin-right:.5rem}
h1{font-size:clamp(2.6rem,10vw,5.6rem);margin-bottom:1rem}

.lead{font-size:1.1rem;color:var(--mute);max-width:32ch;margin-bottom:1.6rem}
.btn{display:inline-block;background:var(--coral);color:#fff;font:500 1rem var(--b);padding:.85rem 1.7rem;border-radius:99px;border:0;text-decoration:none;cursor:pointer;transition:.25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(255,106,77,.35)}
.heroph{min-height:340px;transform:rotate(-2.5deg);margin-right:-2rem;border-radius:24px 0 0 24px}
.sun{position:absolute;right:12%;top:6rem;width:70px;height:70px;border-radius:50%;background:var(--coral);opacity:.9;animation:bob 7s ease-in-out infinite;z-index:-1}
@keyframes bob{50%{transform:translateY(14px)}}
@media(min-width:820px){.hero .w{grid-template-columns:1fr 1.15fr;align-items:end;gap:3rem}.heroph{min-height:520px;margin-right:calc((100vw - 1080px)/-2 - 1.25rem)}}
.waves{margin-top:-2px;height:70px;overflow:hidden;position:relative}
.waves svg{position:absolute;bottom:0;width:200%;height:100%;animation:drift 16s linear infinite}
.waves svg+svg{opacity:.5;animation-duration:26s;animation-direction:reverse;height:80%}
@keyframes drift{to{transform:translateX(-50%)}}

.about{background:var(--mist);padding-top:2.5rem}
.about .w{display:grid;gap:2rem}
.about p{max-width:52ch;color:var(--mute)}
.stats{display:flex;gap:2.5rem;flex-wrap:wrap}
.stats b{display:block;font:700 3.2rem/1 var(--d);color:var(--sea)}
.stats small{color:var(--mute);font-size:.85rem}
@media(min-width:820px){.about .w{grid-template-columns:1.3fr 1fr;align-items:center}}
/* rooms */
.room{display:grid;gap:1.2rem;margin-top:1.8rem;padding:1rem;background:#fff;border-radius:22px;transition:.3s;box-shadow:0 2px 0 rgba(15,42,67,.06)}

.room .ph{min-height:200px}
.room h3{font-size:1.6rem;margin:.2rem 0 .5rem}
.room .for{font-size:.8rem;color:var(--sea);font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.room p{color:var(--mute);margin-bottom:.8rem}
.rate{font:700 1.5rem var(--d)}.rate small{font:400 .8rem var(--b);color:var(--mute);margin-left:.4rem}

.book{background:var(--ink);color:#fff}
.book h2{color:#fff}.book .eyebrow{color:#9CC4E0}
form{display:grid;gap:1rem;max-width:620px}
.row{display:grid;gap:1rem}
@media(min-width:560px){.row{grid-template-columns:1fr 1fr}}
label{display:grid;gap:.35rem;font-size:.88rem}
input,select,textarea{font:inherit;padding:.75rem .9rem;border-radius:10px;border:1.5px solid transparent;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--coral)}
.note{font-size:.85rem;background:rgba(255,255,255,.1);padding:.6rem .9rem;border-radius:10px;border-left:3px solid var(--coral)}
.ok{display:none;background:#fff;color:var(--ink);padding:1rem 1.2rem;border-radius:12px;border-left:4px solid var(--coral)}
.ok.show{display:block}

.loc .w{display:grid;gap:2rem}
.loc .ph{min-height:300px}
.loc h3{font-size:1.05rem;margin:1.1rem 0 .2rem;font-family:var(--b);letter-spacing:0;font-weight:500;color:var(--sea)}

.contact{background:var(--mist)}

.contact dt{color:var(--mute)}
.disc{font-size:.88rem;color:var(--mute);border-top:1px dashed var(--mute);padding-top:.8rem;max-width:60ch}
footer{background:var(--ink);color:#BFD3E3;text-align:center;padding:1.6rem;font-size:.9rem}

.rv{opacity:0;transform:translateY(26px);transition:opacity .8s,transform .8s}

const $=s=>document.querySelectorAll(s);
function setLang(l){
 $('[data-i]').forEach(e=>e.textContent=T[l][e.dataset.i]);
 document.documentElement.lang=l;
 $('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===l));
 try{localStorage.setItem('lang',l)}catch(e){}
}
let cur='en';try{const s=localStorage.getItem('lang');if(s==='th'||s==='en')cur=s}catch(e){}
$('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
setLang(cur);
const nav=document.getElementById('nav');
const sc=()=>nav.classList.toggle('sc',scrollY>30);addEventListener('scroll',sc,{passive:true});sc();
const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
function count(el){const n=+el.dataset.n;if(still){el.textContent=n;return}let s=null;
 (function f(t){s=s||t;const p=Math.min((t-s)/1200,1);el.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(performance.now())}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');e.target.querySelectorAll('[data-n]').forEach(count);io.unobserve(e.target)}}),{threshold:.15});
$('.rv').forEach(e=>io.observe(e));
document.getElementById('f').onsubmit=e=>{e.preventDefault();e.target.reset();const o=document.getElementById('ok');o.classList.add('show');setTimeout(()=>o.classList.remove('show'),8000)};
</script>
